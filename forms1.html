<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form action="/action">
        <div>
        <label for="username">User Name:</label>
        <input type="text" placeholder="enter Username" id="username" name="User"/>
        </div>
        
        <div>
        <label for="password">Password :</label>
        <input type="password" placeholder="enter password" id="password" name="pass"/>
        </div>

        <div>
            <button>Submit</button>
            <button type="submit">type 1 button </button>
        </div>
        <div>
            <button type="button">type 2 button</button>
        </div>

        <div>
            <button type="reset">type 3 button</button>
        </div>

        <div>
            <input type="checkbox" name="age" id="age" checked>
            <label for="age">i am 18+</label>
        </div>

        <div>
            <input type="radio" name="Gender" id="male" value="male">
            <label for="male">Male</label>
            <input type="radio" name="Gender" id="gender" value="female">
            <label for="female">Female</label>
        </div>

    </form>

    <form action="https://www.google.com/search">
        <input type="text" name="q" placeholder="Search on Google">
        <button>Search</button>
    </form>
</body>
</html>
